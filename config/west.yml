# For security and stability reasons, every external dependency must be pinned.
# This ensures maintainers are in control and are able to review changes before
# applying them here.
#
# - For repos maintained by OneDeadKey or their members, we use an `aekeynox`
#   branch as a stable release for the dependency.
# - For any other repo, we pin the exact commit hash we need. Feel free to
#   open a PR to update this hash if improvements are made.

manifest:

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cfergeau
      url-base: https://github.com/cfergeau
    - name: NuclearSquid
      url-base: https://github.com/Nuclear-Squid
    - name: rloutier
      url-base: https://github.com/rloutier
    - name: rschenk
      url-base: https://github.com/rschenk
    - name: gggw
      url-base: https://github.com/Good-Great-Grand-Wonderful
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: black-trooper
      url-base: https://github.com/black-trooper

  projects:
      # We rely on a fork of ZMK for a couple of reasons:
      # 1. to pin the version of ZMK, so we’re not caught off guard by breaking changes
      # 2. to add some more advanced features that aren’t present upstream
      #    (unmerged PRs, custom patches…)
      # More info on the changes present can be found on the fork’s README page.
    - name: zmk
      remote: NuclearSquid
      revision: aekeynox
      import: app/west.yml

      ###
      # Custom behaviors
      ##

      # Safely wraps a dead key on the host layout
    - name: zmk-behavior-dead-key
      remote: NuclearSquid
      revision: aekeynox

      # Wraps a behavior to hold a selection of active modifiers for as long
      # as that key is held
    - name: zmk-behavior-mod-hold
      remote: NuclearSquid
      revision: aekeynox

      ###
      # Community keyboards (not officially supported by ZMK)
      ##

      # Quacken Flex: unibody rp2040-based board
      # Quacken Zero: unibody ProMicro-compatible shield
    - name: zmk-keyboard-quacken
      remote: NuclearSquid
      revision: aekeynox

      # Totem: split XIAO-compatible shield
      # A fork of `GEIGEIGEIST`'s ZMK Totem module, to migrate it to ZMK main
    - name: zmk-config-totem
      remote: cfergeau
      revision: 9677c2fd5af7cee784aafb1b52a25a33357336c2

      # Temper/Chocofi: split ProMicro-compatible shield
      # A fork of `raeedcho`'s ZMK Temper module including long-standing patch proposals.
      # https://github.com/OneDeadKey/zmk-config-aekeynox/pull/101
    - name: temper-zmk-config
      remote: NuclearSquid
      revision: aekeynox

      # Go60: split nrf52840-based board
      # A fork of MoErgo's ZMK go60 module, to migrate it to ZMK main
    - name: zmk-config-go60
      remote: rloutier
      revision: 1bb1f847162f5ccec162c5ba6516d0c73b6a8c39

      # Re-gret: unibody XIAO-compatible shield, 34 keys
    - name: zmk-keyboard-re-gret
      remote: rschenk
      revision: 34ca1fc7dc6991475b0c20f2c8361598e7aaeaca

      # Crosses V2: onboard nRF52840, right central, dual trackballs.
      # Pin the dependencies from its config/west.yml explicitly to retain
      # our ZMK fork and avoid the module's floating dependency revisions.
    - name: crosses-v2-zmk-firmware
      remote: gggw
      revision: a4279793633de831c849e065663d01c05f1c89cd
    - name: zmk-input-processor-report-rate-limit
      remote: badjeff
      revision: b056cb135525933743e2627150fb390f9d4b2461
    - name: zmk-input-processor-xyz
      remote: badjeff
      revision: edb44b7261796a11b3aaecc0f75f1da615789b90
    - name: zmk-driver-paw3222
      remote: black-trooper
      revision: 4797c7c094ae45722a43f3217b3261095df82eac
    - name: zmk-behavior-paw32xx-res-cycle
      remote: gggw
      revision: 98c8583f999ab810bfe2f87a663251e1d5064f03
    - name: zmk-input-processor-pipeline-switch
      remote: gggw
      revision: 6dde67a12f6c604300e94a412fb6f70a2cf33429
    - name: zmk-trackball-config
      remote: gggw
      revision: 66af329fa4ea6484a09384f63189d921cf2df515

  self:
    path: config
