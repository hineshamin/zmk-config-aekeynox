# Build only the Keebart Corne Choc Pro BT firmware for this keyboard.
include:
  - board: corne_choc_pro_left
    shield: aekeynox_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DDTS_EXTRA_CPPFLAGS="-DZMK_BEHAVIORS_KEEP_ALL"
    artifact-name: corne_choc_pro_bt_left
  - board: corne_choc_pro_right
    shield: aekeynox_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_right

  # Recovery targets: clear saved settings and Bluetooth bonds on each half.
  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_left_settings_reset
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_right_settings_reset
