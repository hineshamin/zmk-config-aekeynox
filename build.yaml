# Build only the Crosses V2 42-key firmware for this keyboard.
include:
  - board: crosses_v2_left
    artifact-name: crosses_v2_42_left
  - board: crosses_v2_right
    artifact-name: crosses_v2_42_right
    # Studio uses BLE; reserve USB CDC-ACM for the trackball config app.
    # Keep all behaviors available in Studio without the USB UART snippet.
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DDTS_EXTRA_CPPFLAGS="-DZMK_BEHAVIORS_KEEP_ALL"

  # Recovery targets: clear saved settings and Bluetooth bonds on each half.
  - board: crosses_v2_left
    shield: settings_reset
    artifact-name: crosses_v2_left_settings_reset
  - board: crosses_v2_right
    shield: settings_reset
    artifact-name: crosses_v2_settings_reset
